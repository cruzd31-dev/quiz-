<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Quiz PRO</title>

<style>
body {
    background: #1e1e2f;
    font-family: Arial;
    color: white;
    text-align: center;
}
.container { margin-top: 40px; }
.card {
    background: #2a2a40;
    padding: 20px;
    border-radius: 15px;
    display: inline-block;
    width: 350px;
}
button {
    padding: 10px;
    margin: 5px;
    border-radius: 10px;
    border: none;
    background: #4CAF50;
    color: white;
    cursor: pointer;
}
button:hover { background: #45a049; }
</style>

</head>
<body>

<div class="container">

<div id="inicio" class="card">
<h2>🎮 Quiz PRO</h2>
<button onclick="menu()">Continuar</button>
</div>

<div id="menu" class="card" style="display:none;">
<h3>Selecciona categoría</h3>
<button onclick="iniciar('arit')">Aritmética</button>
<button onclick="iniciar('alg')">Álgebra</button>
<button onclick="iniciar('geo')">Geometría</button>
<button onclick="iniciar('comp')">Computación</button>
<button onclick="iniciar('eng')">Inglés</button>
</div>

<div id="quiz" class="card" style="display:none;">
<h3 id="pregunta"></h3>
<div id="opciones"></div>
</div>

<div id="resultado" class="card" style="display:none;">
<h2 id="final"></h2>
<button onclick="location.reload()">Reiniciar</button>
</div>

</div>

<script>

let preguntas=[], i=0, score=0, categoria="";

function menu(){
    document.getElementById("inicio").style.display="none";
    document.getElementById("menu").style.display="block";
}

function iniciar(cat){
    categoria=cat;
    preguntas=[]; i=0; score=0;

    generarPreguntas();

    document.getElementById("menu").style.display="none";
    document.getElementById("quiz").style.display="block";

    mostrar();
}

// =========================
function generarPreguntas(){

    // ARITMÉTICA
    if(categoria=="arit"){
        let usadas=new Set();
        while(preguntas.length<30){
            let tipo=["+","-","*","/"][rand(0,3)];
            let a,b,r;

            if(tipo=="+"){a=rand(1,50);b=rand(1,50);r=a+b;}
            if(tipo=="-"){a=rand(20,100);b=rand(1,a);r=a-b;}
            if(tipo=="*"){a=rand(1,12);b=rand(1,12);r=a*b;}
            if(tipo=="/"){b=rand(1,10);r=rand(1,10);a=b*r;}

            let texto=`${a} ${tipo} ${b}`;
            if(usadas.has(texto)) continue;
            usadas.add(texto);

            preguntas.push({
                texto,
                opciones:shuffle([r,r+1,r-1]),
                correcta:r,
                explicacion:"Operación básica"
            });
        }
    }

    // ÁLGEBRA
    else if(categoria=="alg"){
        let usadas=new Set();
        while(preguntas.length<30){
            let x=rand(1,20), b=rand(1,20);
            let r=x+b;

            let texto=`x + ${b} = ${r}`;
            if(usadas.has(texto)) continue;
            usadas.add(texto);

            preguntas.push({
                texto,
                opciones:shuffle([x,x+1,x-1]),
                correcta:x,
                explicacion:`x = ${r} - ${b}`
            });
        }
    }

    // GEOMETRÍA
    else if(categoria=="geo"){
        let base=[
            ["Lados de triángulo","3","3","Un triángulo tiene 3 lados"],
            ["Lados de cuadrado","4","4","Un cuadrado tiene 4 lados"],
            ["Lados de pentágono","5","5","Pentágono = 5 lados"]
        ];

        while(preguntas.length<30){
            let p=base[rand(0,base.length-1)];
            preguntas.push({
                texto:p[0],
                opciones:shuffle([p[1],"6","7"]),
                correcta:p[2],
                explicacion:p[3]
            });
        }
    }

    // COMPUTACIÓN
    else if(categoria=="comp"){
        let base=[
            ["Python es","Lenguaje","Lenguaje","Es lenguaje"],
            ["CPU es","Procesador","Procesador","CPU procesa"],
            ["RAM es","Memoria","Memoria","RAM = memoria"]
        ];

        while(preguntas.length<30){
            let p=base[rand(0,base.length-1)];
            preguntas.push({
                texto:p[0],
                opciones:shuffle([p[1],"Red","Pantalla"]),
                correcta:p[2],
                explicacion:p[3]
            });
        }
    }

    // INGLÉS
    else if(categoria=="eng"){
        let base=[
            ["Hello","Hola","Hola","Hello = Hola"],
            ["Bye","Adiós","Adiós","Bye = Adiós"],
            ["Thanks","Gracias","Gracias","Thanks = Gracias"]
        ];

        while(preguntas.length<30){
            let p=base[rand(0,base.length-1)];
            preguntas.push({
                texto:p[0],
                opciones:shuffle([p[1],"Perro","Casa"]),
                correcta:p[2],
                explicacion:p[3]
            });
        }
    }
}

// =========================
function mostrar(){
    let p=preguntas[i];
    document.getElementById("pregunta").innerText=p.texto;

    let div=document.getElementById("opciones");
    div.innerHTML="";

    p.opciones.forEach(op=>{
        let btn=document.createElement("button");
        btn.innerText=op;
        btn.onclick=()=>verificar(op);
        div.appendChild(btn);
    });
}

function verificar(op){
    let p=preguntas[i];

    if(op==p.correcta){
        score++;
    }else{
        alert("❌ "+p.explicacion);
    }

    i++;

    if(i<preguntas.length) mostrar();
    else finalizar();
}

function finalizar(){
    document.getElementById("quiz").style.display="none";
    document.getElementById("resultado").style.display="block";

    let porcentaje=(score/preguntas.length)*100;
    let estado=porcentaje>=90?"✅ APROBADO":"❌ REPROBADO";

    document.getElementById("final").innerText=
        `${porcentaje.toFixed(1)}% - ${estado}`;
}

function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}

</script>

</body>
</html>
