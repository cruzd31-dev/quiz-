// ===== LOGICA =====

function startUser(){
user=document.getElementById("nombre").value;
if(!user) return alert("Ingresa tu nombre");
document.getElementById("inicio").style.display="none";
document.getElementById("menu").style.display="block";
}

function start(cat){
qs=[...banco[cat]];
qs=qs.sort(()=>Math.random()-0.5);
score=0;i=0;
document.getElementById("menu").style.display="none";
document.getElementById("quiz").style.display="block";
next();
}

function next(){
let p=qs[i];
document.getElementById("q").innerText=p.texto;
let div=document.getElementById("opts");
div.innerHTML="";
p.opciones.sort(()=>Math.random()-0.5).forEach(o=>{
let b=document.createElement("button");
b.innerText=o;
b.onclick=()=>check(o);
div.appendChild(b);
});
document.getElementById("bar").style.width=(i/30*100)+"%";
}

function check(op){
let p=qs[i];
if(op==p.correcta) score++;
else alert("❌ Incorrecto");
i++;
if(i<qs.length) next();
else finish();
}

function finish(){
document.getElementById("quiz").style.display="none";
document.getElementById("final").style.display="block";
let pct=(score/30)*100;
let estado=pct>=90?"🏆 APROBADO":"❌ REPROBADO";
document.getElementById("final").innerHTML=
`<h2>${user}</h2><p>${pct.toFixed(1)}%</p><p>${estado}</p>
<button onclick="location.reload()">Reiniciar</button>`;
}
