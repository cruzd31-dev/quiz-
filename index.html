<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Quiz PRO</title>

<style>
body {
    background: #1e1e2f;
    font-family: Arial;
    color: white;
    text-align: center;
}

.container { margin-top: 40px; }

.card {
    background: #2a2a40;
    padding: 20px;
    border-radius: 15px;
    display: inline-block;
    width: 350px;
}

button {
    padding: 10px;
    margin: 5px;
    border-radius: 10px;
    border: none;
    background: #4CAF50;
    color: white;
    cursor: pointer;
}

button:hover { background: #45a049; }

input {
    padding: 10px;
    border-radius: 10px;
    border: none;
}
</style>
</head>

<body>

<div class="container">

<div id="inicio" class="card">
    <h2>🎮 Quiz PRO</h2>
    <input id="nombre" placeholder="Tu nombre"><br><br>
    <button onclick="menu()">Continuar</button>
</div>

<div id="menu" class="card" style="display:none;">
    <h3>Selecciona categoría</h3>
    <button onclick="iniciar('arit')">Aritmética</button>
    <button onclick="iniciar('alg')">Álgebra</button>
    <button onclick="iniciar('geo')">Geometría</button>
    <button onclick="iniciar('comp')">Computación</button>
    <button onclick="iniciar('eng')">Inglés</button>
</div>

<div id="quiz" class="card" style="display:none;">
    <h3 id="pregunta"></h3>
    <div id="opciones"></div>
</div>

<div id="resultado" class="card" style="display:none;">
    <h2 id="final"></h2>
    <button onclick="location.reload()">Reiniciar</button>
</div>

</div>

<script>

let preguntas=[], i=0, score=0, categoria="";

function menu(){
    document.getElementById("inicio").style.display="none";
    document.getElementById("menu").style.display="block";
}

function iniciar(cat){
    categoria=cat;
    preguntas=[]; i=0; score=0;

    generarPreguntas();

    document.getElementById("menu").style.display="none";
    document.getElementById("quiz").style.display="block";

    mostrar();
}

// =========================
function generarPreguntas(){

    // ===== ARITMÉTICA (100% únicas) =====
    if(categoria=="arit"){
        let usadas=new Set();

        while(preguntas.length<30){
            let tipo=["+","-","*","/"][rand(0,3)];
            let a,b,r;

            if(tipo=="+"){a=rand(1,100);b=rand(1,100);r=a+b;}
            if(tipo=="-"){a=rand(50,150);b=rand(1,a);r=a-b;}
            if(tipo=="*"){a=rand(2,15);b=rand(2,15);r=a*b;}
            if(tipo=="/"){b=rand(2,12);r=rand(2,12);a=b*r;}

            let texto=`${a} ${tipo} ${b}`;
            if(usadas.has(texto)) continue;
            usadas.add(texto);

            preguntas.push({
                texto,
                opciones:shuffle([r,r+rand(1,10),r-rand(1,10)]),
                correcta:r,
                explicacion:"Operación básica"
            });
        }
    }

    // ===== ÁLGEBRA (100% únicas) =====
    else if(categoria=="alg"){
        let usadas=new Set();

        while(preguntas.length<30){
            let x=rand(1,50);
            let b=rand(1,50);
            let r=x+b;

            let texto=`x + ${b} = ${r}`;
            if(usadas.has(texto)) continue;
            usadas.add(texto);

            preguntas.push({
                texto,
                opciones:shuffle([x,x+rand(1,5),x-rand(1,5)]),
                correcta:x,
                explicacion:`x = ${r} - ${b}`
            });
        }
    }

    // ===== GEOMETRÍA (sin congelarse) =====
    else if(categoria=="geo"){
        let base=[
            ["¿Lados de triángulo?","3","Un triángulo tiene 3 lados"],
            ["¿Lados de cuadrado?","4","Un cuadrado tiene 4 lados"],
            ["¿Lados de pentágono?","5","Pentágono = 5 lados"],
            ["¿Lados de hexágono?","6","Hexágono = 6 lados"],
            ["¿Lados de octágono?","8","Octágono = 8 lados"],
            ["¿Lados de heptágono?","7","Heptágono = 7 lados"]
        ];

        for(let i=0;i<30;i++){
            let p=base[i % base.length];

            preguntas.push({
                texto:p[0],
                opciones:shuffle([p[1],"9","10"]),
                correcta:p[1],
                explicacion:p[2]
            });
        }
    }

    // ===== COMPUTACIÓN =====
    else if(categoria=="comp"){
        let base=[
            ["Python es...","Lenguaje","Lenguaje de programación"],
            ["CPU es...","Procesador","Unidad de procesamiento"],
            ["RAM es...","Memoria","Memoria temporal"],
            ["HTML es...","Lenguaje","Lenguaje de marcado"],
            ["SSD es...","Almacenamiento","Disco rápido"],
            ["GPU es...","Gráficos","Procesa gráficos"]
        ];

        for(let i=0;i<30;i++){
            let p=base[i % base.length];

            preguntas.push({
                texto:p[0],
                opciones:shuffle([p[1],"Internet","Pantalla"]),
                correcta:p[1],
                explicacion:p[2]
            });
        }
    }

    // ===== INGLÉS =====
    else if(categoria=="eng"){
        let base=[
            ["Hello","Hola","Hello = Hola"],
            ["Bye","Adiós","Bye = Adiós"],
            ["Thanks","Gracias","Thanks = Gracias"],
            ["Dog","Perro","Dog = Perro"],
            ["House","Casa","House = Casa"],
            ["Water","Agua","Water = Agua"]
        ];

        for(let i=0;i<30;i++){
            let p=base[i % base.length];

            preguntas.push({
                texto:p[0],
                opciones:shuffle([p[1],"Carro","Mesa"]),
                correcta:p[1],
                explicacion:p[2]
            });
        }
    }
}

// =========================
function mostrar(){
    let p=preguntas[i];
    document.getElementById("pregunta").innerText=p.texto;

    let div=document.getElementById("opciones");
    div.innerHTML="";

    p.opciones.forEach(op=>{
        let btn=document.createElement("button");
        btn.innerText=op;
        btn.onclick=()=>verificar(op);
        div.appendChild(btn);
    });
}

// =========================
function verificar(op){
    let p=preguntas[i];

    if(op==p.correcta){
        score++;
    }else{
        alert("❌ "+p.explicacion);
    }

    i++;

    if(i<preguntas.length) mostrar();
    else finalizar();
}

// =========================
function finalizar(){
    document.getElementById("quiz").style.display="none";
    document.getElementById("resultado").style.display="block";

    let porcentaje=(score/preguntas.length)*100;
    let estado=porcentaje>=90?"✅ APROBADO":"❌ REPROBADO";

    document.getElementById("final").innerText=
        `Puntaje: ${porcentaje.toFixed(1)}% - ${estado}`;
}

// =========================
function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}

</script>

</body>
</html>
